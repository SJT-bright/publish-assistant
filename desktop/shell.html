<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>发布助手</title><link rel="stylesheet" href="ui-assets/glass.css"><script src="ui-assets/glass.js"></script>
<style>
#platforms{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
.tile[data-brand="toutiao"]{background:linear-gradient(145deg,#ff8d82,#d94038)}
.tile[data-brand="xigua"]{background:linear-gradient(145deg,#80c98d,#378653)}
</style>
<body class="shell"><aside class="sidebar glass"><div class="brand"><span class="tile" data-symbol="film" aria-hidden="true"></span><div><strong>发布助手</strong><small>创作，自在一点</small></div></div><button class="nav active" id="workbench"><span class="badge tile" data-symbol="layers" aria-hidden="true"></span>素材工作台</button><div class="group">平台浏览器</div><div id="platforms"></div><div class="sidebar-bottom"><div class="local-state"><i></i>会话保存在本机</div><p class="note">登录与验证都在 App 内<br>素材填一次 · 草稿或网页发表</p></div></aside>
<div class="toolbar glass"><span id="heading">素材工作台</span><span class="toolbar-divider"></span><span id="address">正在连接本机工作台…</span><div id="pageZoom" class="page-zoom" role="group" aria-label="平台页面缩放" hidden><button class="tool" id="fitPage" aria-pressed="true" title="自动适配平台页面，窗口改变时同步调整">适配页面</button><div class="zoom-adjust"><button id="zoomOut" aria-label="缩小平台页面">−</button><output id="zoomValue" aria-live="polite" aria-atomic="true">100%</output><button id="zoomIn" aria-label="放大平台页面">+</button></div></div><button class="tool" id="back" hidden>返回</button><button class="tool" id="repairDisplay" title="页面空白时修复显示，保留当前视频和填写内容" hidden>修复显示</button><button class="tool" id="reload" hidden>重新加载</button><button class="tool" id="closePopup" hidden>关闭登录子页</button><button class="tool" id="stopLogin" hidden>结束登录等待</button><button id="publicationMode" class="tool" aria-pressed="false" title="开启后可在内嵌的平台页面点击发表；素材工作台上传仍保存草稿">开启网页发表</button><span id="publicationLabel" class="pill">仅保存草稿</span></div>
<section id="taskProgress" class="task-progress glass" aria-label="平台任务进度" hidden>
  <div class="progress-head"><span id="progressScope" class="progress-scope"></span><strong id="progressPlatform"></strong><span id="progressStage" class="progress-stage" role="status" aria-live="polite" aria-atomic="true"></span><output id="progressPercent" class="progress-percent"></output><span id="progressWait" class="progress-wait"></span></div>
  <div id="progressSteps" class="progress-steps" role="progressbar" aria-label="草稿步骤" aria-valuemin="0" aria-valuemax="7">
    <span class="progress-step" data-stage="session">验证登录</span><span class="progress-step" data-stage="video">导入视频</span><span class="progress-step" data-stage="upload">等待上传</span><span class="progress-step" data-stage="content">填写内容</span><span class="progress-step" data-stage="cover">设置封面</span><span class="progress-step" data-stage="save">保存草稿</span><span class="progress-step" data-stage="verify">重开核验</span>
  </div>
  <div id="progressMeter" class="progress-meter" role="progressbar" aria-label="当前平台流程完成百分比" aria-valuemin="0" aria-valuemax="100"><div id="progressFill" class="progress-fill"></div></div>
  <div id="progressOperations" class="progress-operations" aria-label="当前阶段细分步骤"></div>
  <div class="progress-foot"><span id="progressCount" class="progress-count"></span><span id="progressDetail" class="progress-detail"></span></div>
</section><div class="loader" id="connectionPanel" role="status" aria-live="polite"><span id="connectionDetail">正在连接本机工作台…</span><button class="tool" id="reconnect" hidden>重新连接工作台</button></div><div id="error" role="alert"></div><script src="ui-assets/progress-model.js"></script><script src="shell.js"></script></body></html>
