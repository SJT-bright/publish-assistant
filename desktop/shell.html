<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>发布助手</title><link rel="stylesheet" href="ui-assets/glass.css"><script src="ui-assets/glass.js"></script>
<style>
#platforms{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
.tile[data-brand="toutiao"]{background:linear-gradient(145deg,#ff8d82,#d94038)}
.tile[data-brand="xigua"]{background:linear-gradient(145deg,#80c98d,#378653)}
.app-version{display:block;margin:0 0 8px;font-size:12px;color:#526a8d;font-variant-numeric:tabular-nums}
.project-links{display:flex;align-items:center;gap:9px;margin:0 0 10px}.github-star{display:inline-flex;align-items:center;gap:5px;border:1px solid #8ca3c655;border-radius:8px;padding:5px 8px;background:#ffffff50;color:#344f73;font-size:12px;cursor:pointer}.github-star svg{width:15px;height:15px;fill:currentColor}.software-update{display:block;width:100%;margin:0 0 12px;padding:6px 8px;text-align:left;border:1px solid #8ca3c644;border-radius:8px;background:#ffffff40;color:#526a8d;font-size:12px;cursor:pointer}.software-update:disabled{cursor:default;opacity:.7}.software-update.update-ready{color:#185d46;background:#d9f5e6;border-color:#79b79d}.github-star:focus-visible,.software-update:focus-visible{outline:2px solid #526a8d;outline-offset:3px}
.operation-running::before{content:"";display:inline-block;width:12px;height:12px;margin-right:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:operation-spin .7s linear infinite}
@keyframes operation-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.operation-running::before{animation:none}}
</style>
<body class="shell"><aside class="sidebar glass"><div class="brand"><span class="tile" data-symbol="film" aria-hidden="true"></span><div><strong>发布助手</strong><small>创作，自在一点</small></div></div><button class="nav active" id="workbench"><span class="badge tile" data-symbol="layers" aria-hidden="true"></span>素材工作台</button><div class="group">平台浏览器</div><div id="platforms"></div><div class="sidebar-bottom"><div class="project-links"><button id="githubStar" class="github-star" title="打开 GitHub 项目，点击 Star 支持发布助手" aria-label="在 GitHub 上给发布助手点 Star"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.68.08-.68 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.64 0c2.15-1.46 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.63 5.27-5.14 5.55.4.35.76 1.03.76 2.08v3.1c0 .3.2.65.77.54A11.25 11.25 0 0 0 12 .75Z"/></svg><span>Star ☆</span></button></div><span id="appVersion" class="app-version" aria-label="当前应用版本"></span><button id="softwareUpdate" class="software-update" aria-live="polite">检查更新</button><div class="local-state"><i></i>会话保存在本机</div><p class="note">登录与验证都在 App 内<br>素材填一次 · 直接发布或保存草稿</p></div></aside>
<div class="toolbar glass"><span id="heading">素材工作台</span><span class="toolbar-divider"></span><span id="address" role="status" aria-live="polite">正在连接本机工作台…</span><div id="pageZoom" class="page-zoom" role="group" aria-label="平台页面缩放" hidden><button class="tool" id="fitPage" aria-pressed="true" title="自动适配平台页面，窗口改变时同步调整">适配页面</button><div class="zoom-adjust"><button id="zoomOut" aria-label="缩小平台页面">−</button><output id="zoomValue" aria-live="polite" aria-atomic="true">100%</output><button id="zoomIn" aria-label="放大平台页面">+</button></div></div><button class="tool" id="back" hidden>返回</button><button class="tool" id="repairDisplay" title="页面空白时修复显示，保留当前视频和填写内容" hidden>修复显示</button><button class="tool" id="reload" hidden>重新加载</button><button class="tool" id="closePopup" hidden>关闭登录子页</button><button class="tool" id="stopLogin" hidden>结束登录等待</button><button id="publicationMode" class="tool" aria-pressed="false" title="控制平台网页的手动发表按钮；素材工作台按所选的直接发布或保存草稿模式执行">开启网页发表</button><span id="publicationLabel" class="pill">仅保存草稿</span></div>
<section id="taskProgress" class="task-progress glass" aria-label="平台任务进度" hidden>
  <div class="progress-head"><span id="progressScope" class="progress-scope"></span><strong id="progressPlatform"></strong><span id="progressStage" class="progress-stage" role="status" aria-live="polite" aria-atomic="true"></span><output id="progressPercent" class="progress-percent"></output><span id="progressWait" class="progress-wait"></span></div>
  <div id="progressSteps" class="progress-steps" role="progressbar" aria-label="草稿步骤" aria-valuemin="0" aria-valuemax="7">
    <span class="progress-step" data-stage="session">验证登录</span><span class="progress-step" data-stage="video">导入视频</span><span class="progress-step" data-stage="upload">等待上传</span><span class="progress-step" data-stage="content">填写内容</span><span class="progress-step" data-stage="cover">设置封面</span><span class="progress-step" data-stage="save">保存草稿</span><span class="progress-step" data-stage="verify">重开核验</span>
  </div>
  <div id="progressMeter" class="progress-meter" role="progressbar" aria-label="当前平台流程完成百分比" aria-valuemin="0" aria-valuemax="100"><div id="progressFill" class="progress-fill"></div></div>
  <div id="progressOperations" class="progress-operations" aria-label="当前阶段细分步骤"></div>
  <div class="progress-foot"><span id="progressCount" class="progress-count"></span><span id="progressDetail" class="progress-detail"></span></div>
</section><div class="loader" id="connectionPanel" role="status" aria-live="polite"><span id="connectionDetail">正在连接本机工作台…</span><button class="tool" id="reconnect" hidden>重新连接工作台</button></div><div id="error" role="alert"></div><script src="ui-assets/progress-model.js"></script><script src="shell.js"></script></body></html>
